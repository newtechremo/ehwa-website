# [비활성화됨 2026-08-20] 레거시 PM2 서버 배포 워크플로.
#
# 실서비스는 Vercel(barrierfree.eumc.ac.kr → 76.76.21.21)로 이전 완료됐고,
# 이 워크플로가 배포하는 로컬 PM2 서버는 트래픽을 받지 않는다.
#
# 자동 트리거를 제거한 이유:
#   대상 경로 /home/finefit-temp/Desktop/project/ehwa_website 가 개발자의 작업
#   디렉토리와 동일하다. main push 시 아래 스크립트가 그 작업트리에 대해
#   `git stash` → `git pull` → `git stash pop || true` 를 실행하므로,
#   충돌 시 진행 중인 작업이 조용히 유실될 수 있다.
#
# 되살리려면 아래 `push:` 블록의 주석을 해제한다.
name: Deploy to Server (legacy PM2, disabled)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: false
          script: |
            echo "========== 배포 시작 =========="
            cd /home/finefit-temp/Desktop/project/ehwa_website

            # 1. Git Pull (로컬 변경사항 보존)
            echo "1. Git Pull"
            git stash
            git pull origin main
            git stash pop || true

            # 2. 의존성 설치
            echo "2. 의존성 설치"
            npm install

            # 3. 빌드
            echo "3. 프로덕션 빌드"
            npm run build

            # 4. PM2로 서버 재시작
            echo "4. PM2 재시작"
            pm2 describe ehwa-website > /dev/null 2>&1
            if [ $? -eq 0 ]; then
              # 이미 실행 중이면 재시작
              pm2 restart ehwa-website
            else
              # 새로 시작
              pm2 start npm --name "ehwa-website" -- run start
            fi

            # 5. PM2 설정 저장 (서버 재부팅 시 자동 시작)
            pm2 save

            # 완료 확인
            echo "========== 배포 완료 =========="
            pm2 status ehwa-website
